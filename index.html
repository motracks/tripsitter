<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripSitter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f0e;
    --surface: #161918;
    --surface2: #1e2220;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #f0ede8;
    --muted: rgba(240,237,232,0.45);
    --faint: rgba(240,237,232,0.18);
    --green: #4ade9a;
    --green-dim: rgba(74,222,154,0.12);
    --amber: #f5c542;
    --amber-dim: rgba(245,197,66,0.10);
    --red: #ff5f57;
    --red-dim: rgba(255,95,87,0.12);
    --blue: #60aaff;
    --blue-dim: rgba(96,170,255,0.10);
    --r: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; min-height: 100vh; padding-bottom: 3rem; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .wrap { max-width: 560px; margin: 0 auto; }

  /* LOGIN */
  #login { max-width: 360px; margin: 18vh auto 0; padding: 0 1.25rem; }
  #login h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
  #login p.tag { font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 4px; margin-bottom: 2rem; }
  #login form { display: flex; flex-direction: column; gap: 10px; }
  #login input {
    background: var(--surface); border: 0.5px solid var(--border2); border-radius: var(--r);
    padding: 12px 14px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 13px;
  }
  #login input:focus { outline: none; border-color: var(--green); }
  #login button {
    background: var(--green); color: #0d0f0e; border: 0; border-radius: var(--r);
    padding: 12px 0; font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600;
    cursor: pointer; margin-top: 4px;
  }
  #login .linkbtn {
    background: none; border: 0; color: var(--muted); font-family: 'DM Mono', monospace;
    font-size: 11px; cursor: pointer; margin-top: 8px; text-align: center;
  }
  .msg { font-size: 11px; font-family: 'DM Mono', monospace; margin-top: 6px; min-height: 14px; }
  .msg.err { color: var(--red); }
  .msg.ok { color: var(--green); }

  /* HEADER */
  header { padding: 2rem 1.25rem 1rem; display: flex; align-items: flex-end; justify-content: space-between; }
  .header-left h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  .header-left p { font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 3px; }
  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .signout { background: none; border: 0.5px solid var(--border2); color: var(--muted); border-radius: 99px;
    padding: 4px 10px; font-family: 'DM Mono', monospace; font-size: 10px; cursor: pointer; }
  .backbtn { background: none; border: 0; color: var(--muted); font-family: 'DM Mono', monospace;
    font-size: 11px; cursor: pointer; padding: 0; }

  .esta-badge { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .esta-days { font-size: 22px; font-weight: 700; line-height: 1; color: var(--green); }
  .esta-days.warn { color: var(--amber); }
  .esta-days.danger { color: var(--red); }
  .esta-unit { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }
  .esta-label { font-size: 10px; font-family: 'DM Mono', monospace; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .esta-bar-wrap { width: 80px; height: 3px; background: var(--border2); border-radius: 99px; overflow: hidden; margin-top: 4px; }
  .esta-bar { height: 100%; border-radius: 99px; background: var(--green); }
  .esta-bar.warn { background: var(--amber); }
  .esta-bar.danger { background: var(--red); }

  /* TABS */
  .tabs { display: flex; gap: 6px; padding: 0 1.25rem; margin-bottom: 1.25rem; }
  .tab { flex: 1; padding: 9px 0; border-radius: var(--r); border: 0.5px solid var(--border); background: var(--surface); color: var(--muted); font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 500; cursor: pointer; letter-spacing: 0.03em; transition: all 0.15s; text-align: center; }
  .tab.active { background: var(--surface2); border-color: var(--border2); color: var(--text); }

  .panel { display: none; padding: 0 1.25rem; }
  .panel.active { display: block; }

  /* TIMELINE */
  .timeline { position: relative; }
  .trip-map { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 220px;
    border: 0.5px solid var(--border2); border-radius: var(--r); overflow: hidden;
    background: var(--surface); margin-bottom: 1rem; cursor: pointer; }
  .trip-map canvas { display: block; width: 100%; height: 100%; }
  .trip-map:hover { border-color: var(--green); }
  .trip-map::after { content: 'open map'; position: absolute; right: 8px; bottom: 6px;
    font-family: 'DM Mono', monospace; font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--muted); background: var(--bg);
    padding: 2px 6px; border-radius: 6px; pointer-events: none; }
  .tl-line { position: absolute; left: 19px; top: 8px; bottom: 8px; width: 1px; background: var(--border2); }
  .tl-item { display: flex; gap: 14px; margin-bottom: 10px; animation: fadeUp 0.3s ease both; }
  .tl-dot-wrap { flex-shrink: 0; width: 38px; display: flex; flex-direction: column; align-items: center; padding-top: 14px; }
  .tl-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--border2); background: var(--bg); }
  .tl-dot.flight { border-color: var(--blue); background: var(--blue-dim); }
  .tl-dot.bus { border-color: var(--green); background: var(--green-dim); }
  .tl-dot.train { border-color: var(--amber); background: var(--amber-dim); }
  .tl-dot.stay { border-color: var(--faint); background: var(--bg); }

  .tl-card { flex: 1; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r); padding: 12px 14px; cursor: pointer; transition: border-color 0.15s; }
  .tl-card:hover { border-color: var(--border2); }
  .tl-card.expanded { border-color: var(--border2); }
  .tl-card-header { display: flex; align-items: center; justify-content: space-between; }

  .tl-type-pill { font-size: 10px; font-family: 'DM Mono', monospace; padding: 2px 7px; border-radius: 99px; letter-spacing: 0.06em; text-transform: uppercase; }
  .pill-flight { background: var(--blue-dim); color: var(--blue); }
  .pill-bus { background: var(--green-dim); color: var(--green); }
  .pill-train { background: var(--amber-dim); color: var(--amber); }
  .pill-stay { background: var(--faint); color: var(--muted); }

  .tl-date { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--muted); }
  .tl-title { font-size: 15px; font-weight: 600; margin-top: 6px; line-height: 1.3; }
  .tl-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .tl-details { display: none; margin-top: 12px; padding-top: 12px; border-top: 0.5px solid var(--border); flex-direction: column; gap: 8px; }
  .tl-details.open { display: flex; }

  .detail-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .detail-label { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--muted); flex-shrink: 0; }
  .detail-value { font-size: 12px; font-weight: 500; text-align: right; }

  /* INFO CARDS */
  .card-grid { display: flex; flex-direction: column; gap: 10px; }
  .info-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r); padding: 14px 16px; cursor: pointer; transition: border-color 0.15s; }
  .info-card:hover { border-color: var(--border2); }
  .info-card.expanded { border-color: var(--border2); }
  .ic-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .ic-city { font-size: 17px; font-weight: 700; }
  .ic-dates { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--muted); margin-top: 3px; }
  .ic-tag { font-size: 10px; font-family: 'DM Mono', monospace; color: var(--muted); border: 0.5px solid var(--border2); border-radius: 99px; padding: 2px 8px; flex-shrink: 0; }
  .ic-details { display: none; margin-top: 12px; padding-top: 12px; border-top: 0.5px solid var(--border); flex-direction: column; gap: 8px; }
  .ic-details.open { display: flex; }

  /* TRIP CARDS (overview) */
  .trip-card { display: block; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r); padding: 16px 18px; cursor: pointer; transition: border-color 0.15s, transform 0.15s; }
  .trip-card:hover { border-color: var(--border2); transform: translateY(-1px); }
  .trip-card .tc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .tc-name { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .tc-dest { font-size: 12px; font-family: 'DM Mono', monospace; color: var(--muted); margin-top: 3px; }
  .tc-dates { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--faint); margin-top: 8px; }
  .tc-total { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--green); margin-top: 6px; letter-spacing: 0.04em; }
  .status-pill { font-size: 10px; font-family: 'DM Mono', monospace; padding: 3px 9px; border-radius: 99px; text-transform: uppercase; letter-spacing: 0.06em; flex-shrink: 0; }
  .status-upcoming { background: var(--blue-dim); color: var(--blue); }
  .status-ongoing { background: var(--green-dim); color: var(--green); }
  .status-done { background: var(--faint); color: var(--muted); }

  .total-bar { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r); padding: 14px 16px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-top: 10px; }
  .total-bar .tb-label { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .total-bar .tb-value { font-size: 14px; font-weight: 700; color: var(--green); text-align: right; }
  .total-bar.total-expand { cursor: pointer; transition: border-color 0.15s; }
  .total-bar.total-expand:hover { border-color: var(--border2); }
  .tb-breakdown { width: 100%; margin-top: 12px; padding-top: 12px; border-top: 0.5px solid var(--border); }

  .cur-picker {
    background: var(--surface2); color: var(--muted); border: 0.5px solid var(--border2);
    border-radius: 6px; padding: 2px 4px; font-family: 'DM Mono', monospace; font-size: 10px;
    cursor: pointer; -webkit-appearance: none; appearance: none;
  }
  .cur-picker:hover { color: var(--text); border-color: var(--green); }
  .tb-value .cur-picker { font-size: 11px; vertical-align: middle; margin-left: 6px; }

  .section-label { font-size: 10px; font-family: 'DM Mono', monospace; color: var(--faint); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; margin-top: 0.5rem; }

  .trip-section { margin-bottom: 18px; }
  .section-head { width: 100%; display: flex; justify-content: space-between; align-items: center;
    background: none; border: 0; padding: 4px 2px 10px; cursor: pointer;
    font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.1em; }
  .section-head:hover { color: var(--text); }
  .section-head .sh-count { color: var(--faint); margin-left: 4px; }
  .section-head .sh-caret { font-size: 10px; color: var(--faint); }
  .section-body { display: flex; flex-direction: column; gap: 10px; }
  .empty-note { font-size: 12px; font-family: 'DM Mono', monospace; color: var(--faint); text-align: center; padding: 2rem 0; }

  .copy-btn { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 6px; padding: 2px 7px; cursor: pointer; transition: color 0.15s; }
  .copy-btn:active { color: var(--green); }

  .hidden { display: none !important; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* BUTTONS */
  .btn { font-family: 'Syne', sans-serif; font-weight: 600; font-size: 12px; border-radius: var(--r);
    padding: 9px 14px; cursor: pointer; border: 0.5px solid var(--border2); background: var(--surface2); color: var(--text); }
  .btn-green { background: var(--green); color: #0d0f0e; border-color: var(--green); }
  .btn-ghost { background: none; color: var(--muted); }
  .btn-danger { background: var(--red-dim); color: var(--red); border-color: rgba(255,95,87,0.25); }
  .btn-sm { font-size: 10px; padding: 4px 9px; font-family: 'DM Mono', monospace; font-weight: 400; }
  .add-row { display: flex; justify-content: flex-end; margin-bottom: 10px; }
  .ov-controls { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; }
  .ov-controls input[type="search"] {
    flex: 1; background: var(--surface); border: 0.5px solid var(--border2); border-radius: var(--r);
    padding: 9px 12px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 12px;
  }
  .ov-controls input[type="search"]:focus { outline: none; border-color: var(--green); }
  .ov-controls .btn { white-space: nowrap; }

  .card-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 12px; padding-top: 12px; border-top: 0.5px solid var(--border); }

  /* MODAL */
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: flex-start;
    justify-content: center; padding: 6vh 1rem 2rem; overflow-y: auto; z-index: 50; }
  .modal-box { background: var(--surface); border: 0.5px solid var(--border2); border-radius: 14px;
    width: 100%; max-width: 440px; padding: 20px; animation: fadeUp 0.2s ease both; }
  .modal-box h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .modal-box .mb-sub { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--muted); margin-bottom: 16px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .field label { font-size: 10px; font-family: 'DM Mono', monospace; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .field input, .field select, .field textarea {
    background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 8px; padding: 9px 11px;
    color: var(--text); font-family: 'DM Mono', monospace; font-size: 12px; width: 100%;
  }
  .field textarea { min-height: 60px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--green); }
  .field-2 { display: flex; gap: 10px; }
  .field-2 > .field { flex: 1; }
  .modal-actions { display: flex; gap: 8px; justify-content: space-between; margin-top: 8px; }
  .modal-actions .right { display: flex; gap: 8px; }
  .modal-msg { font-size: 11px; font-family: 'DM Mono', monospace; min-height: 14px; margin-top: 8px; color: var(--red); }

  /* ATTACHMENT */
  .attach-box { border: 0.5px dashed var(--border2); border-radius: 8px; padding: 12px; text-align: center;
    font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); cursor: pointer; }
  .attach-box:hover { border-color: var(--green); color: var(--text); }
  .attach-thumb { max-width: 120px; max-height: 120px; border-radius: 8px; background: #fff; padding: 4px; }
  .attach-gallery { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .attach-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface2);
    border: 0.5px solid var(--border2); border-radius: 99px; padding: 4px 6px 4px 10px;
    font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); }
  .attach-chip .x { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 13px; line-height: 1; padding: 0 2px; }
  .attach-chip .x:hover { color: var(--red); }
  .parse-note { font-size: 10px; color: var(--amber); font-family: 'DM Mono', monospace; margin-top: 6px; }
  .attach-thumb { cursor: zoom-in; }

  /* IMAGE LIGHTBOX — full-size preview for QR codes / tickets, sized to be
     camera-scannable (like a wallet pass) rather than a tiny thumbnail. */
  #img-lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: flex;
    align-items: center; justify-content: center; padding: 6vh 5vw; z-index: 60; cursor: zoom-out; }
  #img-lightbox img { max-width: min(92vw, 520px); max-height: 78vh; width: auto; height: auto;
    background: #fff; padding: 22px; border-radius: 18px; box-shadow: 0 24px 70px rgba(0,0,0,0.55);
    animation: fadeUp 0.15s ease both; }
  #img-lightbox .lightbox-hint { position: absolute; top: 3vh; left: 0; right: 0; text-align: center;
    font-family: 'DM Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.6); }

  /* ONBOARDING / SETTINGS */
  #onboarding { max-width: 460px; margin: 8vh auto 0; padding: 0 1.25rem 3rem; }
  #onboarding h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
  #onboarding .ob-sub { font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 4px; margin-bottom: 1.5rem; }
  .ob-section { border-top: 0.5px solid var(--border); padding: 16px 0 4px; }
  .ob-section:first-of-type { border-top: 0; }
  .ob-section h3 { font-size: 10px; font-family: 'DM Mono', monospace; color: var(--faint); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
  .perm-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
  .perm-row select, .perm-row input { font-size: 11px; padding: 7px 8px; max-width: 100%; min-width: 0; }
  .perm-row select { flex: 1 1 130px; }
  .perm-row input { flex: 2 1 140px; }
  .perm-row .x { background: none; border: 0; color: var(--muted); cursor: pointer; font-family: 'DM Mono', monospace; flex: 0 0 auto; }
  .settings-btn { background: none; border: 0.5px solid var(--border2); color: var(--muted); border-radius: 99px;
    padding: 4px 10px; font-family: 'DM Mono', monospace; font-size: 10px; cursor: pointer; }

  /* TAG INPUT */
  .tag-input { background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 8px;
    padding: 6px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; position: relative; }
  .tag-input:focus-within { border-color: var(--green); }
  .tag-input input { background: none; border: 0; color: var(--text); font-family: 'DM Mono', monospace;
    font-size: 12px; padding: 4px; flex: 1; min-width: 80px; }
  .tag-input input:focus { outline: none; }
  .place-pill { display: inline-flex; align-items: center; gap: 5px; background: var(--surface); border: 0.5px solid var(--border2);
    border-radius: 99px; padding: 3px 4px 3px 8px; font-size: 11px; font-family: 'DM Mono', monospace; }
  .place-pill .x { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12px; line-height: 1; padding: 0 3px; }
  .tag-menu { position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; background: var(--surface);
    border: 0.5px solid var(--border2); border-radius: 8px; z-index: 10; overflow: hidden; }
  .tag-menu button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--text);
    font-family: 'DM Mono', monospace; font-size: 12px; padding: 8px 10px; cursor: pointer; }
  .tag-menu button:hover { background: var(--surface2); }
  .tag-menu .muted { color: var(--muted); font-size: 10px; }

  .country-picker { position: relative; display: block; }
  .country-picker input { background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 8px;
    padding: 9px 11px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 12px; width: 100%; }
  .country-picker input:focus { outline: none; border-color: var(--green); }
  .cp-menu { position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; background: var(--surface);
    border: 0.5px solid var(--border2); border-radius: 8px; z-index: 20; overflow: hidden; }
  .cp-menu button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--text);
    font-family: 'DM Mono', monospace; font-size: 12px; padding: 8px 10px; cursor: pointer; }
  .cp-menu button:hover { background: var(--surface2); }
  .perm-row .country-picker { flex: 1 1 130px; }

  /* PLACE PILLS on cards / header */
  .tc-places, .detail-places { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .mini-pill { font-size: 10px; font-family: 'DM Mono', monospace; color: var(--muted); background: var(--surface2);
    border: 0.5px solid var(--border); border-radius: 99px; padding: 2px 7px; }

  /* VISA PANEL */
  .visa-block { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r); padding: 14px 16px; margin-bottom: 10px; }
  .visa-block .vb-country { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .visa-badge { font-size: 10px; font-family: 'DM Mono', monospace; padding: 3px 9px; border-radius: 99px; text-transform: uppercase; letter-spacing: 0.05em; }
  .vb-green { background: var(--green-dim); color: var(--green); }
  .vb-amber { background: var(--amber-dim); color: var(--amber); }
  .vb-red { background: var(--red-dim); color: var(--red); }
  .vb-grey { background: var(--faint); color: var(--muted); }
  .visa-block .vb-line { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .visa-block .vb-bar-wrap { height: 4px; background: var(--border2); border-radius: 99px; overflow: hidden; margin-top: 6px; max-width: 180px; }
  .visa-block .vb-bar { height: 100%; border-radius: 99px; }

  NAD:'Namibian Dollar', MUR:'Mauritian Rupee', MVR:'Maldivian Rufiyaa', FJD:'Fijian Dollar',
  GEL:'Georgian Lari', AMD:'Armenian Dram', AZN:'Azerbaijani Manat', KZT:'Kazakh Tenge',
  UZS:'Uzbek Sum', MDL:'Moldovan Leu', ALL:'Albanian Lek', MKD:'Macedonian Denar',
  BAM:'Bosnia-Herzegovina Mark', RUB:'Russian Ruble', XOF:'West African CFA Franc',
  XAF:'Central African CFA Franc', XPF:'CFP Franc',
};
const ccyLabel = (c) => `${sym(c)} ${c}${CCY_NAME[c] ? ' — ' + CCY_NAME[c] : ''}`;

// Build <option>s for a currency select: the given trip's tagged-country
// currencies first (as a group), then the rest.
function currencyOptions(selected, tripCountryCodes = [], compact = false) {
  const pri = [...new Set(tripCountryCodes.map(currencyForCountry))].filter(c => CURRENCIES.includes(c));
  const rest = CURRENCIES.filter(c => !pri.includes(c));
  const label = (c) => compact ? `${sym(c)} ${c}` : ccyLabel(c);
  const optFor = (c) => `<option value="${c}"${c === String(selected) ? ' selected' : ''}>${esc(label(c))}</option>`;
  let html = '';
  if (pri.length) html += `<optgroup label="this trip">${pri.map(optFor).join('')}</optgroup><optgroup label="all currencies">`;
  html += rest.map(optFor).join('');
  if (pri.length) html += '</optgroup>';
  return html;
}

// FX rates via the /api/fx proxy (browser can't reach frankfurter.app
// directly). Cached per from|to|date for the session.
const rateCache = new Map();
async function getRate(from, to, date) {
  from = from || 'EUR'; to = to || 'EUR';
  if (from === to) return 1;
  const day = (date || new Date().toISOString().slice(0, 10)).slice(0, 10);
  const key = `${from}|${to}|${day}`;
  if (rateCache.has(key)) return rateCache.get(key);
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 8000);
  let rate = null;
  try {
    const res = await fetch(`/api/fx?from=${from}&to=${to}&date=${day}`, { signal: ctrl.signal });
    if (res.ok) rate = (await res.json())?.rate ?? null;
  } catch { /* leave null */ }
  finally { clearTimeout(t); }
  if (rate != null) rateCache.set(key, rate);
  return rate;
}

// ---------- geo resolution (maps feature) ----------
// Coords are resolved once and cached on the row. Flights use a local airport
// table (arrives in a later commit — AIRPORTS is stubbed empty for now, so
// flights fall through to the text geocoder). Everything goes through the
// /api/geocode proxy (Nominatim). All calls are timeout-bounded and
// fire-and-forget from the save path — a slow/failed lookup never blocks the UI.
// { IATA: { name, city, country, lat, lng } } — lazy-loaded from the bundled
// table on first flight lookup, never on the login / overview path.
let AIRPORTS = null;
let airportsPromise = null;
function loadAirports() {
  if (AIRPORTS) return Promise.resolve(AIRPORTS);
  if (!airportsPromise) {
    airportsPromise = fetch('data/airports.json')
      .then(r => r.ok ? r.json() : {})
      .catch(() => ({}))
      .then(j => (AIRPORTS = j));
  }
  return airportsPromise;
}
const geoCache = new Map();

function extractIATA(text) {
  if (!text) return null;
  const paren = String(text).match(/\(([A-Za-z]{3})\)/);
  if (paren) return paren[1].toUpperCase();
  const bare = String(text).match(/\b([A-Z]{3})\b/);
  return bare ? bare[1] : null;
}

// "Chicago (ORD)" -> "Chicago"; "New York (31st & 8th)" -> "New York"
function cityOnly(text) {
  return String(text || '').replace(/\s*\([^)]*\)\s*/g, ' ').replace(/\s+/g, ' ').trim();
}

async function geocode(q, country) {
  q = String(q || '').trim();
  if (q.length < 2) return null;
  const key = q + '|' + (country || '');
  if (geoCache.has(key)) return geoCache.get(key);
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 8000);
  let hit = null;
  try {
    const url = '/api/geocode?q=' + encodeURIComponent(q) + (country ? '&country=' + encodeURIComponent(country) : '');
    const res = await fetch(url, { signal: ctrl.signal });
    if (res.ok) {
      const j = await res.json();
      if (j && j.lat != null) hit = { lat: j.lat, lng: j.lng, display_name: j.display_name };
    }
  } catch { /* leave null */ }
  finally { clearTimeout(t); }
  geoCache.set(key, hit);
  return hit;
}

// Resolve one transport endpoint. mode: 'flight' | 'bus' | 'train' | 'car' | 'ferry' | ...
async function geoForTransportEnd(text, mode) {
  if (!text) return null;
  if (mode === 'flight') {
    const iata = extractIATA(text);
    if (iata) {
      const table = await loadAirports();
      const a = table[iata];
      if (a) return { lat: a.lat, lng: a.lng, source: 'iata' };
    }
  }
  const stationy = mode === 'bus' || mode === 'train' || mode === 'ferry';
  if (stationy) {
    const hit = await geocode(text + ' station');
    if (hit) return { lat: hit.lat, lng: hit.lng, source: 'station' };
  } else {
    const hit = await geocode(text);
    if (hit) return { lat: hit.lat, lng: hit.lng, source: 'city' };
  }
  const city = cityOnly(text);
  if (city && city !== text) {
    const hit = await geocode(city);
    if (hit) return { lat: hit.lat, lng: hit.lng, source: 'city' };
  }
  return null;
}

// Match a trip place tag to a stay's city, preferring one that carries coords.
function placeTagForCity(city, placeTags) {
  if (!city || !Array.isArray(placeTags)) return null;
  const c = cityOnly(city).toLowerCase();
  return placeTags.find(p => p.lat != null && p.label && c.includes(String(p.label).toLowerCase()))
      || placeTags.find(p => p.label && c.includes(String(p.label).toLowerCase()))
      || null;
}

async function geoForStay(stay, placeTags) {
  const country = (placeTagForCity(stay.city, placeTags)?.country || '').toLowerCase() || null;
  if (stay.address) {
    const hit = await geocode(stay.address, country);
    if (hit) return { lat: hit.lat, lng: hit.lng, source: 'address' };
  }
  const tag = placeTagForCity(stay.city, placeTags);
  if (tag && tag.lat != null) return { lat: tag.lat, lng: tag.lng, source: 'placetag' };
  if (stay.city) {
    const hit = await geocode(cityOnly(stay.city), country);
    if (hit) return { lat: hit.lat, lng: hit.lng, source: 'city' };
  }
  return null;
}

// Fire-and-forget wrappers for the save path — resolve coords after an
// insert/update, write them back, swallow errors. Never run over a manual pin.
// (The await-able variants live further down, next to the backfill pass.)
function resolveStayGeo(row) {
  resolveStayGeoAwait(row).catch(() => {}).then(() => renderTripMapForCurrentTrip());
}
function resolveTransportGeo(row) {
  resolveTransportGeoAwait(row).catch(() => {}).then(() => renderTripMapForCurrentTrip());
}

// ---------- canvas maps (per-trip mini-map; also the globe's 2D fallback) ----------
// One renderer for everything map-shaped: bundled country outlines + stay dots
// + transport polylines, drawn on a <canvas> in an equirectangular projection.
// Swapping to a static-map provider later = rewrite only renderTripMap().
let worldGeo = null, worldGeoPromise = null;
function loadWorldGeo() {
  if (worldGeo) return Promise.resolve(worldGeo);
  if (!worldGeoPromise) {
    worldGeoPromise = fetch('data/world-110m.json')
      .then(r => r.ok ? r.json() : null)
      .catch(() => null)
      .then(j => (worldGeo = j));
  }
  return worldGeoPromise;
}

// bbox: {minLat,maxLat,minLng,maxLng}. Fits [minLng,maxLng]x[minLat,maxLat]
// into the canvas, letterboxed, no distortion beyond the equirectangular one.
function renderTripMap(canvas, { points = [], legs = [], bbox }) {
  if (!canvas || !bbox || !worldGeo) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cssW = canvas.clientWidth || 320, cssH = canvas.clientHeight || 180;
  canvas.width = cssW * dpr; canvas.height = cssH * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  const styles = getComputedStyle(document.documentElement);
  const col = (n, f) => (styles.getPropertyValue(n).trim() || f);
  const landFill = col('--surface2', '#1e2220');
  const landStroke = col('--border2', 'rgba(255,255,255,0.12)');
  const dotCol = col('--green', '#4ade9a');
  const legCols = { flight: col('--blue', '#60aaff'), bus: col('--green', '#4ade9a'),
    train: col('--amber', '#f5c542'), car: col('--muted', '#888'),
    ferry: col('--muted', '#888'), other: col('--muted', '#888') };

  // fit: same scale on both axes so shapes aren't stretched
  const lngSpan = Math.max(bbox.maxLng - bbox.minLng, 0.05);
  const latSpan = Math.max(bbox.maxLat - bbox.minLat, 0.05);
  const scale = Math.min(cssW / lngSpan, cssH / latSpan);
  const offX = (cssW - lngSpan * scale) / 2;
  const offY = (cssH - latSpan * scale) / 2;
  const px = (lng) => offX + (lng - bbox.minLng) * scale;
  const py = (lat) => offY + (bbox.maxLat - lat) * scale;

  // land
  ctx.fillStyle = landFill; ctx.strokeStyle = landStroke; ctx.lineWidth = 0.5;
  const drawRing = (ring) => {
    ctx.beginPath();
    ring.forEach(([lng, lat], i) => { const x = px(lng), y = py(lat);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.closePath(); ctx.fill(); ctx.stroke();
  };
  for (const f of worldGeo.features) {
    const g = f.geometry; if (!g) continue;
    const polys = g.type === 'Polygon' ? [g.coordinates]
      : g.type === 'MultiPolygon' ? g.coordinates : [];
    for (const poly of polys) for (const ring of poly) drawRing(ring);
  }

  // transport legs
  ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  for (const leg of legs) {
    if (leg.o == null || leg.d == null) continue;
    ctx.strokeStyle = legCols[leg.mode] || legCols.other;
    ctx.beginPath();
    ctx.moveTo(px(leg.o.lng), py(leg.o.lat));
    ctx.lineTo(px(leg.d.lng), py(leg.d.lat));
    ctx.stroke();
  }

  // stay dots
  for (const p of points) {
    const x = px(p.lng), y = py(p.lat);
    ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = dotCol; ctx.fill();
    ctx.strokeStyle = col('--bg', '#0d0f0e'); ctx.lineWidth = 1.5; ctx.stroke();
  }
}

// Collect a trip's resolved coords, drop far-flung transport ends (the FRA end
// of a FRA->JFK flight on a US road trip), and return points + legs + bbox.
function tripMapData(stays, transport) {
  const stayPts = (stays || [])
    .filter(s => s.lat != null && s.lng != null)
    .map(s => ({ lat: s.lat, lng: s.lng, id: s.id, label: s.city }));

  const legs = (transport || []).map(t => ({
    id: t.id, mode: (t.type || 'other').toLowerCase(),
    o: t.origin_lat != null ? { lat: t.origin_lat, lng: t.origin_lng } : null,
    d: t.dest_lat != null ? { lat: t.dest_lat, lng: t.dest_lng } : null,
  }));

  // median of stay points (fallback: all transport ends) as the trip's centre
  const core = stayPts.length ? stayPts
    : legs.flatMap(l => [l.o, l.d].filter(Boolean));
  if (!core.length) return null;
  const med = (arr, k) => { const v = arr.map(p => p[k]).sort((a, b) => a - b);
    return v[Math.floor(v.length / 2)]; };
  const cLat = med(core, 'lat'), cLng = med(core, 'lng');
  const far = (p) => {
    const dLat = (p.lat - cLat) * 111;
    const dLng = (p.lng - cLng) * 111 * Math.cos(cLat * Math.PI / 180);
    return Math.hypot(dLat, dLng) > 1500; // km
  };

  const pts = [...stayPts];
  for (const l of legs) {
    // keep the destination end always; drop a far origin
    if (l.o && far(l.o)) l.o = null;
    if (l.d && far(l.d) && stayPts.length) l.d = null;
    if (l.o) pts.push(l.o);
    if (l.d) pts.push(l.d);
  }
  if (!pts.length) return null;

  let minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
  for (const p of pts) {
    minLat = Math.min(minLat, p.lat); maxLat = Math.max(maxLat, p.lat);
    minLng = Math.min(minLng, p.lng); maxLng = Math.max(maxLng, p.lng);
  }
  // pad ~15%, and enforce a minimum span so a single-city trip isn't a pinpoint
  const padLat = Math.max((maxLat - minLat) * 0.15, 1.5);
  const padLng = Math.max((maxLng - minLng) * 0.15, 1.5);
  const bbox = { minLat: minLat - padLat, maxLat: maxLat + padLat,
    minLng: minLng - padLng, maxLng: maxLng + padLng };
  return { points: stayPts, legs, bbox };
}

// Resolve any null coords for the open trip's rows, write them back, then
// re-render the mini-map. Throttled; runs once per Trip-tab open.
let tripGeoBackfilling = false;
async function backfillTripGeo() {
  if (tripGeoBackfilling || !currentTrip) return;
  tripGeoBackfilling = true;
  try {
    const jobs = [];
    for (const s of currentStays) {
      if (s.lat == null && (s.address || s.city) && s.geo_source !== 'manual')
        jobs.push(() => resolveStayGeoAwait(s));
    }
    for (const t of currentTransport) {
      const needsO = t.origin_lat == null && t.origin;
      const needsD = t.dest_lat == null && t.destination;
      if ((needsO || needsD) && t.geo_source !== 'manual')
        jobs.push(() => resolveTransportGeoAwait(t));
    }
    // max ~4 concurrent
    const queue = jobs.slice();
    const workers = Array.from({ length: 4 }, async () => {
      while (queue.length) { const job = queue.shift(); try { await job(); } catch {} }
    });
    await Promise.all(workers);
  } finally {
    tripGeoBackfilling = false;
  }
  renderTripMapForCurrentTrip();
}

// await-able variants of the fire-and-forget resolvers (for the backfill pass)
async function resolveStayGeoAwait(row) {
  if (!row?.id || row.geo_source === 'manual') return;
  const g = await geoForStay(row, currentTrip?.place_tags);
  if (!g) return;
  row.lat = g.lat; row.lng = g.lng; row.geo_source = g.source;
  await sb.from('stays').update({ lat: g.lat, lng: g.lng, geo_source: g.source }).eq('id', row.id);
}
async function resolveTransportGeoAwait(row) {
  if (!row?.id || row.geo_source === 'manual') return;
  const mode = (row.type || 'flight').toLowerCase();
  const [o, d] = await Promise.all([
    geoForTransportEnd(row.origin, mode),
    geoForTransportEnd(row.destination, mode),
  ]);
  const patch = {};
  if (o) { patch.origin_lat = o.lat; patch.origin_lng = o.lng; }
  if (d) { patch.dest_lat = d.lat; patch.dest_lng = d.lng; }
  if (!Object.keys(patch).length) return;
  patch.geo_source = (o && d) ? (o.source === 'iata' || d.source === 'iata' ? 'iata' : o.source) : 'partial';
  Object.assign(row, patch);
  await sb.from('transport').update(patch).eq('id', row.id);
}

async function renderTripMapForCurrentTrip() {
  const wrap = $('trip-map');
  const data = tripMapData(currentStays, currentTransport);
  if (!data) { wrap.classList.add('hidden'); return; }
  await loadWorldGeo();
  if (!worldGeo) { wrap.classList.add('hidden'); return; }
  wrap.classList.remove('hidden');
  renderTripMap($('trip-map-canvas'), data);
}

// Ensure a stay/transport row has amount_base in the trip's base currency,
// converted at the rate for the day it was entered. Writes the cache back to
// the DB when it computes something new. Mutates `row` in place.
async function ensureBase(table, row, baseCurrency) {
  const cur = row.currency || 'EUR';
  const price = Number(row.price);
  if (row.price == null || Number.isNaN(price)) { row.amount_base = null; return; }
  if (price === 0) { row.amount_base = 0; return; }
  const day = (row.created_at || new Date().toISOString()).slice(0, 10);
  const fresh = row.amount_base != null
    && row.base_rate_date === day
    && row._base_for === baseCurrency + '|' + cur;
  if (fresh) return;

  if (cur === baseCurrency) {
    row.amount_base = price;
  } else {
    const rate = await getRate(cur, baseCurrency, day);
    if (rate == null) { row.amount_base = row.amount_base ?? null; return; }
    row.amount_base = Math.round(price * rate * 100) / 100;
  }
  row.base_rate_date = day;
  row._base_for = baseCurrency + '|' + cur;
  await sb.from(table).update({ amount_base: row.amount_base, base_rate_date: day }).eq('id', row.id);
}

// Convert every row, then return base-currency subtotals. A failing FX
// lookup for one row never blocks the rest or the render.
async function convertAndSum(stays, transport, baseCurrency) {
  await Promise.allSettled([
    ...stays.map(r => ensureBase('stays', r, baseCurrency)),
    ...transport.map(r => ensureBase('transport', r, baseCurrency)),
  ]);
  // amount_base where we have it; else the raw price if it's already in the
  // base currency; else 0 (an un-convertible foreign amount).
  const rowVal = (r) => {
    if (r.amount_base != null) return Number(r.amount_base) || 0;
    if ((r.currency || 'EUR') === baseCurrency) return Number(r.price) || 0;
    return 0;
  };
  const sum = (rows) => rows.reduce((a, r) => a + rowVal(r), 0);
  const staysTotal = sum(stays), transportTotal = sum(transport);
  return { staysTotal, transportTotal, total: staysTotal + transportTotal };
}

function permRowHTML(perm = {}) {

    const toDelete = (existing || []).filter(x => !keepIds.includes(x.id)).map(x => x.id);

let overviewTrips = [], overviewCharges = {};

async function routeToOverview() {
  show('overview');
  const list = $('trips-list');
  list.innerHTML = '<p class="empty-note">loading…</p>';
  const { data: { user } } = await sb.auth.getUser();
  $('overview-sub').textContent = user?.email || 'travel archive';
  const [tripsRes, staysRes, transportRes] = await Promise.all([
    sb.from('trips').select('*').order('start_date', { ascending: false }),
    sb.from('stays').select('trip_id, city, host_name, notes, price, currency, amount_base'),
    sb.from('transport').select('trip_id, origin, destination, carrier, notes, price, currency, amount_base'),
  ]);
  const { data: trips, error } = tripsRes;
  if (error) { list.innerHTML = `<p class="empty-note">${esc(error.message)}</p>`; return; }

  overviewCharges = {};
  for (const r of [...(staysRes.data || []), ...(transportRes.data || [])]) {
    const v = r.amount_base != null ? Number(r.amount_base) : Number(r.price);
    overviewCharges[r.trip_id] = (overviewCharges[r.trip_id] || 0) + (!Number.isNaN(v) ? v : 0);
  }
  // build a lowercase haystack per trip for search
  const bagByTrip = {};
  for (const r of (staysRes.data || [])) bagByTrip[r.trip_id] = (bagByTrip[r.trip_id] || '') + ' ' + [r.city, r.host_name, r.notes].filter(Boolean).join(' ');
  for (const r of (transportRes.data || [])) bagByTrip[r.trip_id] = (bagByTrip[r.trip_id] || '') + ' ' + [r.origin, r.destination, r.carrier, r.notes].filter(Boolean).join(' ');

  overviewTrips = (trips || []).map(t => ({
    ...t,
    _search: [
      t.name, t.destination,
      ...(Array.isArray(t.place_tags) ? t.place_tags.map(p => p.label + ' ' + (COUNTRY_NAME[p.country] || '')) : []),
      bagByTrip[t.id] || '',
    ].join(' ').toLowerCase(),
  }));

  $('trip-search').value = '';
  renderOverview('');
}

function tripCardHTML(t) {

    : '';

    </div>

    <div class="tc-total">Total ${fmtMoney(overviewCharges[t.id] || 0, base)}</div>

function renderOverview(query) {
  const list = $('trips-list');
  const q = (query || '').trim().toLowerCase();
  const rows = q ? overviewTrips.filter(t => t._search.includes(q)) : overviewTrips;

  if (!overviewTrips.length) { list.innerHTML = '<p class="empty-note">No trips yet.</p>'; return; }
  if (!rows.length) { list.innerHTML = `<p class="empty-note">Nothing matches “${esc(query)}”.</p>`; return; }

  const groups = { ongoing: [], upcoming: [], done: [] };
  for (const t of rows) groups[tripStatus(t)]?.push(t);
  groups.ongoing.sort((a, b) => (a.start_date || '').localeCompare(b.start_date || ''));
  groups.upcoming.sort((a, b) => (a.start_date || '').localeCompare(b.start_date || ''));
  groups.done.sort((a, b) => (b.start_date || '').localeCompare(a.start_date || ''));

  const SECTIONS = [['ongoing', 'Ongoing'], ['upcoming', 'Upcoming'], ['done', 'Past']];
  list.innerHTML = SECTIONS.filter(([k]) => groups[k].length).map(([k, label]) => {
    // when searching, always expand
    const collapsed = !q && collapsedSections.has(k);
    return `<div class="trip-section" data-section="${k}">
      <button type="button" class="section-head${collapsed ? ' collapsed' : ''}">
        <span>${label} <span class="sh-count">${groups[k].length}</span></span>
        <span class="sh-caret">${collapsed ? '▸' : '▾'}</span>
      </button>
      <div class="section-body"${collapsed ? ' style="display:none"' : ''}>
        ${groups[k].map(tripCardHTML).join('')}
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.trip-card').forEach(c =>
    c.addEventListener('click', () => openTrip(c.dataset.trip)));
  list.querySelectorAll('.section-head').forEach(h => h.addEventListener('click', () => {
    const sec = h.closest('.trip-section').dataset.section;
    const body = h.nextElementSibling;
    const nowCollapsed = !h.classList.contains('collapsed');
    h.classList.toggle('collapsed', nowCollapsed);
    body.style.display = nowCollapsed ? 'none' : '';
    h.querySelector('.sh-caret').textContent = nowCollapsed ? '▸' : '▾';
    if (nowCollapsed) collapsedSections.add(sec); else collapsedSections.delete(sec);
    try { localStorage.setItem('ts_collapsed', JSON.stringify([...collapsedSections])); } catch {}
  }));
}

// Guess a trip's base currency from its destination when unset.
function guessCurrency(destination) {
  const d = (destination || '').toLowerCase();
  if (/\b(usa|united states|u\.s|america|new york|nyc|chicago|los angeles)\b/.test(d)) return 'USD';
  if (/\b(uk|united kingdom|england|london|scotland)\b/.test(d)) return 'GBP';
  if (/\b(switzerland|swiss|zurich|geneva)\b/.test(d)) return 'CHF';
  if (/\b(canada|toronto|vancouver)\b/.test(d)) return 'CAD';
  if (/\b(australia|sydney|melbourne)\b/.test(d)) return 'AUD';
  if (/\b(japan|tokyo)\b/.test(d)) return 'JPY';
  return 'EUR';
}

async function openTrip(tripId) {
  show('detail');
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === 0));
  document.querySelectorAll('#detail .panel').forEach((p, i) => p.classList.toggle('active', i === 0));
  invalidateComplianceCache();

  const [{ data: trip }, { data: stays }, { data: transport }, { data: user }] = await Promise.all([
    sb.from('trips').select('*').eq('id', tripId).single(),
    sb.from('stays').select('*').eq('trip_id', tripId).order('start_date', { ascending: true }),
    sb.from('transport').select('*').eq('trip_id', tripId).order('departure', { ascending: true }),
    sb.auth.getUser(),
  ]);
  const { data: docs } = await sb.from('travel_docs').select('*').eq('user_id', user.user.id);

  // Set base currency if the trip has none yet.
  if (trip && !trip.base_currency) {
    trip.base_currency = guessCurrency(trip.destination);
    sb.from('trips').update({ base_currency: trip.base_currency }).eq('id', trip.id);
  }

  currentTrip = trip;
  currentStays = stays || [];
  currentTransport = transport || [];
  currentDocs = docs || [];

  $('detail-name').textContent = trip?.name || 'Trip';
  const dateRange = trip ? `${fmtDate(trip.start_date)} – ${fmtDate(trip.end_date)}`.trim() : '';
  $('detail-sub').innerHTML = trip
    ? `${placeTagsHTML(trip.place_tags, trip.destination)}<div style="margin-top:4px">${esc(dateRange)}</div>`
    : '';

  renderVisaHeader(trip);
  renderTimeline(currentStays, currentTransport);
  renderTripMapForCurrentTrip();
  backfillTripGeo();
  renderStays(currentStays);
  renderTransport(currentTransport);
  renderVisa(docs || [], trip);
  refreshTotals();
}

// ---------- visa ----------
let visaData = null, visaMeta = null;
async function loadVisaData() {
  if (visaData) return visaData;
  const grab = async (url, ms) => {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), ms);
    try {
      const r = await fetch(url, { signal: c.signal });
      if (!r.ok) return null;
      return await r.json();
    } catch { return null; }
    finally { clearTimeout(t); }
  };
  const [d, m] = await Promise.all([
    grab('/data/passport-index.json', 12000),
    grab('/data/passport-index.meta.json', 6000),
  ]);
  visaData = d || {};       // {} = "no data", handled downstream
  visaMeta = m;
  return visaData;
}

  'e-visa': { how: 'An electronic visa — an online application with documents and a fee, processed in days to weeks, sent as a PDF you print. Apply well before travel, only on the official government portal (many lookalike sites charge extra).' },
  'visa required': { how: 'A visa must be obtained in advance, usually at an embassy/consulate or an accredited visa centre: an application form, photos, a fee, often proof of funds, accommodation and onward travel, and sometimes an interview. Start 4–8 weeks ahead.' },

function visaPortal(cc, status, citizenName) {
  const known = VISA_PORTAL[`${cc}|${status}`];
  if (known) return { url: known, label: 'official application portal ↗' };
  // ETIAS covers most of Europe for eta
  if (status === 'eta' && EU_SCHENGEN.has(cc)) return { url: 'https://travel-europe.europa.eu/etias_en', label: 'ETIAS — official portal ↗' };
  return {
    url: 'https://www.google.com/search?q=' + encodeURIComponent(`${COUNTRY_NAME[cc] || cc} ${status === 'e-visa' ? 'e-visa' : status === 'eta' ? 'electronic travel authorisation' : 'visa'} official application ${citizenName} citizens`),
    label: 'find the official site ↗',
  };
}
const EU_SCHENGEN = new Set(['AT','BE','HR','CZ','DK','EE','FI','FR','DE','GR','HU','IS','IT','LV','LI','LT','LU','MT','NL','NO','PL','PT','SK','SI','ES','SE','CH']);

// Some visa-on-arrival / e-visa statuses aren't a single fixed limit — the
// traveller picks between a few durations at different prices. Curated by
// hand like VISA_PORTAL above: incomplete by design, missing entries just
// render nothing. The passport-index dataset's own `days` figure is always
// the longest/most-permissive of these tiers.
const VISA_OPTIONS = {
  'NP|visa on arrival': [
    { days: 15, fee: '$30' },
    { days: 30, fee: '$50' },
    { days: 90, fee: '$125' },
  ],
};
function visaOptionsFor(cc, status) { return VISA_OPTIONS[`${cc}|${status}`] || null; }

// ── Nomad day-counting: rolling / calendar-year presence across ALL trips ──
// All of the user's trips are needed here (not just the open one), since a
// bloc or annual cap is spent across every trip that touched it. Fetched
// once per detail-view visit and cached on this module-level array.
let allTripsForCompliance = null;
async function loadAllTripsForCompliance() {
  if (allTripsForCompliance) return allTripsForCompliance;
  const { data } = await sb.from('trips').select('id,start_date,end_date,country_codes');
  allTripsForCompliance = data || [];
  return allTripsForCompliance;
}
function invalidateComplianceCache() { allTripsForCompliance = null; }

const DAY_MS = 86400000;
const toDay = (d) => { const t = new Date(String(d).slice(0, 10) + 'T00:00:00Z'); return Number.isNaN(+t) ? null : t; };

// Nights spent across `trips` whose country_codes intersect `scopeCcs`,
// overlapping the inclusive [windowStart, windowEnd] date range. A trip
// tagged with any country in scope counts its whole date range — TripSitter
// doesn't track which days of a multi-country trip were spent where.
function nightsInWindowForScope(trips, scopeCcs, windowStart, windowEnd) {
  let total = 0;
  for (const t of trips || []) {
    if (!(t.country_codes || []).some(cc => scopeCcs.has(cc))) continue;
    const s = toDay(t.start_date), e = toDay(t.end_date || t.start_date);
    if (!s || !e) continue;
    const from = s > windowStart ? s : windowStart;
    const to = e < windowEnd ? e : windowEnd;
    if (to >= from) total += Math.round((to - from) / DAY_MS) + 1;
  }
  return total;
}

// Schengen 90/180: days spent in the bloc in the rolling 180-day window
// ending on asOfDate (typically the trip's last day), across every trip.
function schengenStatus(trips, asOfDate) {
  const end = toDay(asOfDate);
  if (!end) return null;
  const start = new Date(end.getTime() - 179 * DAY_MS);
  const days = nightsInWindowForScope(trips, EU_SCHENGEN, start, end);
  return { days, cap: 90, remaining: Math.max(0, 90 - days), windowStart: start, windowEnd: end };
}

// A single country's calendar-year cap (e.g. India's e-Visa: 180 days in one
// calendar year) — sourced from the matching visa document's annual_cap_days,
// never from a hardcoded per-country table. Year = the year of asOfDate.
function annualCapStatus(trips, cc, asOfDate, capDays) {
  const ref = toDay(asOfDate);
  if (!ref || capDays == null) return null;
  const year = ref.getUTCFullYear();
  const start = new Date(Date.UTC(year, 0, 1));
  const end = new Date(Date.UTC(year, 11, 31));
  const days = nightsInWindowForScope(trips, new Set([cc]), start, end);
  return { days, cap: capDays, remaining: Math.max(0, capDays - days), year };
}

// Rendered Schengen 90/180 card — shown once per trip (not per country) when
// any tagged destination is in the bloc.
function schengenBlockHTML(trips, asOfDate) {
  const s = schengenStatus(trips, asOfDate);
  if (!s) return '';
  const pct = Math.min((s.days / s.cap) * 100, 100);
  const tone = s.days >= s.cap ? 'vb-red' : (s.days >= s.cap * 0.8 ? 'vb-amber' : 'vb-green');
  const barColor = tone === 'vb-red' ? 'var(--red)' : tone === 'vb-amber' ? 'var(--amber)' : 'var(--green)';
  return `<div class="visa-block info-card">
    <div class="vb-country">🇪🇺 Schengen 90/180 rule</div>
    <div class="vb-line">Counted across the whole Schengen bloc as one, not per-country.</div>
    <div class="vb-line" style="margin-top:8px">Rolling 180-day window ending ${fmtDateY(String(s.windowEnd.toISOString().slice(0, 10)))}: <b>${s.cap} days</b></div>
    <div class="vb-line">Days spent in Schengen (all trips): ${s.days}
      <div class="vb-bar-wrap"><div class="vb-bar" style="width:${pct}%;background:${barColor}"></div></div>
      ${s.days >= s.cap ? '<b style="color:var(--red)">exceeds the 90/180 limit</b>' : s.days >= s.cap * 0.8 ? '<span style="color:var(--amber)">close to the limit</span>' : `${s.remaining} days left in this window`}
    </div>
  </div>`;
}

// True if a travel_docs.country value (free text or ISO-2) refers to destCC.
function countryMatches(docCountry, destCC) {
  if (!docCountry || !destCC) return false;
  const dc = String(docCountry).trim();
  if (dc.toUpperCase() === destCC.toUpperCase()) return true;
  const name = COUNTRY_NAME[destCC];
  return !!name && dc.toLowerCase() === name.toLowerCase();
}

// Best requirement for one destination across the traveller's passports,
// with a residency/long-stay permission overriding to "resident", and an
// approved visa on file overriding to that visa's own permitted stay length.
function computeVisa(destCC) {
  if (!destCC || !visaData) return null;
  const cits = (currentProfile?.citizenships || []).filter(Boolean);
  const perm = (currentPermissions || []).find(p => p.country === destCC);
  if (perm) return { status: 'resident', label: `${perm.label || perm.kind}`, tone: 'green', days: null, viaPermission: true };

  const docMatch = (currentDocs || []).find(d =>
    d.doc_type === 'Visa' && countryMatches(d.country, destCC) && /approved|active|valid|granted|issued/i.test(d.status || ''));
  if (docMatch) {
    const days = docMatch.max_stay_days != null && docMatch.max_stay_days !== '' ? Number(docMatch.max_stay_days) : null;
    const annualCapDays = docMatch.annual_cap_days != null && docMatch.annual_cap_days !== '' ? Number(docMatch.annual_cap_days) : null;
    return { status: 'approved visa', label: 'Approved visa', tone: 'green', days, viaDocument: true, annualCapDays, doc: docMatch };
  }

  let best = null;
  for (const c of cits) {
    if (c === destCC) { best = { status: 'visa free', days: null, passport: c }; break; }
    const rule = visaData[c]?.[destCC];
    if (!rule) continue;
    const status = typeof rule === 'object' ? rule.status : String(rule);
    const days = typeof rule === 'object' ? (rule.days ?? null) : (/^\d+$/.test(String(rule)) ? +rule : null);
    if (!best || VISA_RANK[status] < VISA_RANK[best.status]) best = { status, days, passport: c };
  }
  if (!best) return null;
  return {
    status: best.status,
    label: VISA_LABEL[best.status] || best.status,
    tone: VISA_TONE[best.status] || 'grey',
    days: best.days,
    passport: best.passport,
  };
}

async function renderVisaHeader(trip) {
  await loadVisaData();
  const el = $('visa-header');
  const ccs = (trip?.country_codes || []);
  const tripDays = nights(trip?.start_date, trip?.end_date);
  if (!ccs.length || !(currentProfile?.citizenships || []).length) {
    el.innerHTML = `<div class="esta-label" style="text-align:right">visa — set citizenship &amp; destination</div>`;
    return;
  }
  // worst (most restrictive) rule across destination countries
  let worst = null;
  for (const cc of ccs) {
    const v = computeVisa(cc);
    if (v && v.status !== 'resident' && (!worst || VISA_RANK[v.status] > VISA_RANK[worst.status])) worst = { ...v, cc };
  }
  if (!worst) { el.innerHTML = `<div class="esta-label" style="text-align:right">no visa needed</div>`; return; }

  let bar = '';
  if (worst.days != null && tripDays != null) {
    const pct = Math.min((tripDays / worst.days) * 100, 100);
    const tone = tripDays >= worst.days ? 'red' : (tripDays >= worst.days * 0.8 ? 'amber' : 'green');
    bar = `<div class="esta-bar-wrap"><div class="esta-bar ${tone === 'red' ? 'danger' : tone === 'amber' ? 'warn' : ''}" style="width:${pct}%"></div></div>
           <div class="esta-label" style="text-align:right">${tripDays} / ${worst.days} days</div>`;
  }
  el.innerHTML = `<span class="visa-badge vb-${worst.tone}">${esc(worst.label)}</span>
    <div class="esta-label" style="text-align:right;margin-top:3px">${flagEmoji(worst.cc)} ${esc(COUNTRY_NAME[worst.cc] || worst.cc)}</div>
    ${bar}`;
}

function renderTimeline(stays, transport) {
  const items = [
    ...transport.map(t => ({ kind: 'transport', when: t.departure, data: t })),
    ...stays.map(s => ({ kind: 'stay', when: s.start_date, data: s })),
  ].filter(i => i.when)
   .sort((a, b) => new Date(a.when) - new Date(b.when));

  const tl = $('timeline');
  tl.innerHTML = '<div class="tl-line"></div>';
  if (!items.length) { tl.innerHTML += '<p class="empty-note">Nothing scheduled.</p>'; return; }

  const gapLabel = (ms) => {
    const h = Math.floor(ms / 3600000), m = Math.round((ms % 3600000) / 60000);
    return h > 0 ? `${h}h ${m}m` : `${m}m`;
  };

  items.forEach((item, idx) => {
    const delay = (0.05 + idx * 0.03).toFixed(2);

    // Layover connector: previous item is transport, this is transport, and
    // the two legs are within 24h of each other.
    const prev = items[idx - 1];
    if (item.kind === 'transport' && prev?.kind === 'transport') {
      const prevEnd = new Date(prev.data.arrival || prev.data.departure);
      const thisStart = new Date(item.data.departure);
      const gap = thisStart - prevEnd;
      if (gap >= 0 && gap < 86400000) {
        tl.insertAdjacentHTML('beforeend', `
          <div class="layover-connector">
            <div class="layover-line"></div>
            <div class="layover-pill">${gapLabel(gap)} until ${esc((item.data.type || 'next').toLowerCase())}</div>
            <div class="layover-line"></div>

      }
    }

    if (item.kind === 'transport') {
      const t = item.data;
      const type = (t.type || '').toLowerCase();
      const rows = [
        t.booking_code && `<div class="detail-row"><span class="detail-label">Booking</span><span class="detail-value" style="display:flex;align-items:center;gap:6px">${esc(t.booking_code)} <button class="copy-btn" onclick="event.stopPropagation();copyText('${esc(String(t.booking_code).replace(/\s/g,''))}',this)">copy</button></span></div>`,

        type === 'train' && t.track_info && `<div class="detail-row"><span class="detail-label">Track</span><span class="detail-value">${esc(t.track_info)}</span></div>`,
        t.arrival && `<div class="detail-row"><span class="detail-label">Arrives</span><span class="detail-value">${esc(fmtDT(t.arrival))}</span></div>`,
        t.price != null && `<div class="detail-row"><span class="detail-label">Price</span><span class="detail-value">${Number(t.price) === 0 ? 'free' : fmtMoney(t.price, t.currency)}</span></div>`,
        t.notes && `<div class="detail-row"><span class="detail-label">Notes</span><span class="detail-value">${esc(t.notes)}</span></div>`,
        attachmentRow(t),
      ].filter(Boolean).join('');
      tl.insertAdjacentHTML('beforeend', `
        <div class="tl-item" style="animation-delay:${delay}s">
          <div class="tl-dot-wrap"><div class="tl-dot ${dotClass(type)}"></div></div>
          <div class="tl-card" onclick="toggleCard(this)">
            <div class="tl-card-header">
              <span class="tl-type-pill ${pillClass(type)}">${esc(t.type || 'travel')}</span>
              <span class="tl-date">${esc(fmtDT(t.departure))}</span>
            </div>
            <div class="tl-title">${esc(t.origin || '')} → ${esc(t.destination || '')}</div>
            <div class="tl-sub">${esc(t.carrier || '')}</div>
            <div class="tl-details">${rows || '<div class="detail-row"><span class="detail-label">No extra detail</span><span class="detail-value"></span></div>'}
              <div class="card-actions"><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();editTransport('${t.id}')">edit</button></div>
            </div>
          </div>
        </div>`);
    } else {
      const s = item.data;
      const n = nights(s.start_date, s.end_date);
      const rows = [
        s.host_name && `<div class="detail-row"><span class="detail-label">Host</span><span class="detail-value">${esc(s.host_name)}</span></div>`,
        s.address && `<div class="detail-row"><span class="detail-label">Address</span><span class="detail-value"><a href="https://maps.google.com/?q=${encodeURIComponent(s.address)}" target="_blank">${esc(s.address)} ↗</a></span></div>`,

        s.notes && `<div class="detail-row"><span class="detail-label">Notes</span><span class="detail-value">${esc(s.notes)}</span></div>`,
        attachmentRow(s),
      ].filter(Boolean).join('');
      tl.insertAdjacentHTML('beforeend', `
        <div class="tl-item" style="animation-delay:${delay}s">
          <div class="tl-dot-wrap"><div class="tl-dot stay"></div></div>
          <div class="tl-card" onclick="toggleCard(this)">

  hydrateAttachments(tl);
