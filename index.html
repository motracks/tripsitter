                <div class="vb-bar-wrap"><div class="vb-bar" style="width:${pct}%;background:${barColor}"></div></div>
                ${a.days >= a.cap ? '<b style="color:var(--red)">exceeds the calendar-year cap</b>' : a.days >= a.cap * 0.8 ? '<span style="color:var(--amber)">close to the cap</span>' : `${a.remaining} days left this year`}
              </div>`;
          }
        }

        const primaryName = COUNTRY_NAME[primary] || primary;
        const explain = VISA_EXPLAIN[v.status];
        const options = visaOptionsFor(cc, v.status);
        const portal = v.status === 'visa free' || v.status === 'visa on arrival' || v.viaDocument
          ? null : visaPortal(cc, v.status, primaryName);
        const passportNote = v.passport && v.passport !== primary
          ? `<div class="vb-line">Best on your ${flagEmoji(v.passport)} ${esc(COUNTRY_NAME[v.passport])} passport.</div>` : '';

        // The matching document, surfaced right here instead of making you
        // go find it in Your documents below — everything for this country
        // in one place.
        const docSummary = v.viaDocument && v.doc ? (() => {
          const d = v.doc;
          const rows = [
            d.status && `<div class="detail-row"><span class="detail-label">Status</span><span class="detail-value">${esc(d.status)}</span></div>`,
            d.expires_on && `<div class="detail-row"><span class="detail-label">Expires</span><span class="detail-value">${esc(fmtDateY(d.expires_on))}</span></div>`,
            d.reference_number && `<div class="detail-row"><span class="detail-label">Reference</span><span class="detail-value" style="font-family:'DM Mono',monospace">${esc(d.reference_number)}</span></div>`,
            d.notes && `<div class="detail-row"><span class="detail-label">Notes</span><span class="detail-value">${esc(d.notes)}</span></div>`,
            attachmentRow(d),
          ].filter(Boolean).join('');
          return `<div class="vb-line" style="margin-top:8px;padding-top:8px;border-top:0.5px solid var(--border)">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
              <span class="section-label" style="margin:0">Your visa document</span>
              <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();editDoc('${d.id}')">edit</button>
            </div>
            ${rows}
          </div>`;
        })() : '';

        return `<div class="visa-block info-card" onclick="toggleCard(this)" style="cursor:pointer">
          <div class="vb-country">${flagEmoji(cc)} ${esc(COUNTRY_NAME[cc] || cc)}
            <span class="visa-badge vb-${v.tone}">${esc(v.label)}</span></div>
          ${v.viaPermission ? `<div class="vb-line">You hold <b>${esc(v.label)}</b> — the visa rules below may not apply to you.</div>` : ''}
          ${passportNote}
          ${bar}
          ${annualBar}
          <div class="ic-details">
            ${docSummary}
            ${explain ? `<div class="vb-line">${esc(explain.how)}</div>` : ''}
            ${options ? `<div class="vb-line">Options at the border: ${options.map(o => `<b>${o.days} days</b> (${esc(o.fee)})`).join(' · ')} — multiple-entry rates, confirm current fees officially.</div>` : ''}
            ${v.days != null ? `<div class="vb-line">Permitted stay on this basis: <b>${v.days} days</b> per entry.</div>` : ''}
            ${portal ? `<div class="vb-line"><a href="${portal.url}" target="_blank" rel="noopener">${portal.label}</a></div>` : ''}
            <div class="vb-line"><a href="https://www.google.com/search?q=${encodeURIComponent((COUNTRY_NAME[cc] || cc) + ' entry requirements ' + primaryName + ' citizens official government')}" target="_blank" rel="noopener">full official requirements ↗</a></div>
          </div>
        </div>`;
      }).join('') +
      (ccs.some(cc => EU_SCHENGEN.has(cc)) ? schengenBlockHTML(complianceTrips, asOfDate) : '');
  }

  // ── Your documents (existing travel_docs CRUD) ─────────────
  // Relevance first: documents matching one of this trip's tagged countries
  // float to the top (in the order those countries are tagged), then
  // everything else keeps its original order.
  const sortedDocs = docs.slice().sort((a, b) => {
    const rank = (d) => { const i = ccs.findIndex(cc => countryMatches(d.country, cc)); return i === -1 ? ccs.length : i; };
    return rank(a) - rank(b);
  });
  const docsHTML = sortedDocs.length ? sortedDocs.map(d => {
    const days = tripDays;
    // Passport expiry: many countries require 3–6 months' validity beyond
    // travel, so flag inside that window, not just once actually expired.
    const passportWarn = d.doc_type === 'Passport' && d.expires_on ? (() => {
      const left = Math.round((toDay(d.expires_on) - toDay(new Date().toISOString().slice(0, 10))) / DAY_MS);
      if (left < 0) return { tone: 'var(--red)', text: `expired ${Math.abs(left)} days ago — renew before travelling` };
      if (left <= 180) return { tone: 'var(--amber)', text: `expires in ${left} days — many countries require 3–6 months' validity beyond your travel dates` };
      return null;
    })() : null;
    const rows = [
      d.status && `<div class="detail-row"><span class="detail-label">Status</span><span class="detail-value">${esc(d.status)}</span></div>`,
      d.expires_on && `<div class="detail-row"><span class="detail-label">Expires</span><span class="detail-value">${esc(fmtDateY(d.expires_on))}</span></div>`,
      passportWarn && `<div class="detail-row"><span class="detail-label">⚠</span><span class="detail-value" style="color:${passportWarn.tone}">${esc(passportWarn.text)}</span></div>`,
      d.reference_number && `<div class="detail-row"><span class="detail-label">Reference</span><span class="detail-value" style="display:flex;align-items:center;gap:6px;font-family:'DM Mono',monospace">${esc(d.reference_number)} <button class="copy-btn" onclick="event.stopPropagation();copyText('${esc(d.reference_number)}',this)">copy</button></span></div>`,
      d.doc_type === 'Visa' && d.max_stay_days != null && `<div class="detail-row"><span class="detail-label">Allowed stay</span><span class="detail-value">${esc(d.max_stay_days)} days</span></div>`,
      d.doc_type === 'Visa' && d.annual_cap_days != null && `<div class="detail-row"><span class="detail-label">Per calendar year</span><span class="detail-value">${esc(d.annual_cap_days)} days</span></div>`,
      d.doc_type === 'ESTA' && days != null && `<div class="detail-row"><span class="detail-label">This trip</span><span class="detail-value">${days} days used</span></div>`,
      d.notes && `<div class="detail-row"><span class="detail-label">Notes</span><span class="detail-value">${esc(d.notes)}</span></div>`,
      attachmentRow(d),
    ].filter(Boolean).join('');
    return `<div class="info-card" onclick="toggleCard(this)">
      <div class="ic-header">
        <div><div class="ic-city">${esc(d.doc_type || 'Document')}</div><div class="ic-dates">${esc(d.country || '')}</div></div>
        <span class="ic-tag"${passportWarn ? ` style="background:${passportWarn.tone}"` : ''}>${passportWarn ? '⚠ ' : ''}${esc(d.status || '')}</span>
      </div>
      <div class="ic-details">${rows}
        <div class="card-actions"><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();editDoc('${d.id}')">edit</button></div>
      </div>
    </div>`;
  }).join('') : '<p class="empty-note">No documents saved.</p>';

  const asOf = visaMeta?.fetched_on ? ` (data as of ${visaMeta.fetched_on})` : '';
  el.innerHTML = `
    ${guidance}
    <div class="visa-disclaimer">
      Guidance only, from a community-maintained dataset${esc(asOf)}. Visa rules change —
      always confirm entry requirements on the destination's official government website
      before you book or travel.
    </div>
    <p class="section-label" style="margin-top:1.5rem">Your documents</p>
    ${docsHTML}`;
  hydrateAttachments($('visa-list'));
}

// ---------- CRUD: modal form engine ----------
// A field spec: { key, label, type, options?, required?, half? }
// types: text | number | date | datetime | textarea | select | currency
function fieldHTML(f, val) {
  let html = fieldInner(f, val);
  if (f.showIf) {
    // tag the outer .field so applyConditionalFields can show/hide it
    html = html.replace('<div class="field"', `<div class="field" data-showif="${esc(f.showIf.field)}:${esc(f.showIf.in.join('|'))}"`);
  }
  return html;
}
function fieldInner(f, val) {
  const v = val == null ? '' : val;
  if (f.type === 'places') {
    const tags = Array.isArray(val) ? val : [];
    const pills = tags.map((t, i) => placePillHTML(t, i)).join('');
    return `<div class="field"><label>${esc(f.label)}</label>
      <div class="tag-input" data-key="${f.key}" data-tags='${esc(JSON.stringify(tags))}'>
        ${pills}
        <input type="text" placeholder="country, city or region…" autocomplete="off">
        <div class="tag-menu hidden"></div>
      </div>
      <div style="font-size:10px;font-family:'DM Mono',monospace;color:var(--faint);margin-top:4px">pick a suggestion, or press Enter for free text</div>
    </div>`;
  }
  if (f.type === 'textarea')
    return `<div class="field"><label>${esc(f.label)}</label><textarea data-key="${f.key}">${esc(v)}</textarea></div>`;
  if (f.type === 'select' || f.type === 'currency') {
    const opt = (o) => {
      const val = typeof o === 'object' ? o.value : o;
      const lab = typeof o === 'object' ? o.label : o;
      return `<option value="${esc(val)}"${String(val) === String(v) ? ' selected' : ''}>${esc(lab)}</option>`;
    };
    let opts;
    if (f.type === 'currency') {
      opts = currencyOptions(v, currentTrip?.country_codes || []);
    } else if (f.groups) {
      opts = f.groups.map(g => `<optgroup label="${esc(g.label)}">${g.options.map(opt).join('')}</optgroup>`).join('');
    } else {
      opts = f.options.map(opt).join('');
    }
    return `<div class="field"><label>${esc(f.label)}</label><select data-key="${f.key}">${f.required ? '' : '<option value="">—</option>'}${opts}</select></div>`;
  }
  const inputType = f.type === 'datetime' ? 'datetime-local' : (f.type === 'date' ? 'date' : (f.type === 'number' ? 'number' : 'text'));
  let iv = v;
  if (f.type === 'datetime' && v) iv = new Date(v).toISOString().slice(0, 16);
  if (f.type === 'date' && v) iv = String(v).slice(0, 10);
  const hintEl = f.airportHint ? `<div class="airport-hint" data-hint-for="${f.key}" style="font-size:10px;font-family:'DM Mono',monospace;color:var(--faint);margin-top:4px"></div>` : '';
  return `<div class="field"><label>${esc(f.label)}</label><input type="${inputType}"${f.type === 'number' ? ' step="0.01"' : ''} data-key="${f.key}" value="${esc(iv)}">${hintEl}</div>`;
}

let modalOnClose = null;
function closeModal() { $('modal').classList.add('hidden'); $('modal').innerHTML = ''; if (modalOnClose) { const f = modalOnClose; modalOnClose = null; f(); } }
window.closeModal = closeModal;

// ---------- place tag input ----------
function placePillHTML(t, i) {
  const flag = t.country ? flagEmoji(t.country) + ' ' : '';
  return `<span class="place-pill" data-i="${i}">${flag}${esc(t.label)}<button type="button" class="x" data-remove="${i}">×</button></span>`;
}
// Read-only place tags for cards / headers. Falls back to the free-text
// destination string when there are no structured tags.
function placeTagsHTML(tags, fallback) {
  const list = Array.isArray(tags) ? tags : [];
  if (!list.length) return fallback ? `<div class="tc-dest">${esc(fallback)}</div>` : '';
  const show = list.slice(0, 3).map(t =>
    `<span class="mini-pill">${t.country ? flagEmoji(t.country) + ' ' : ''}${esc(t.label)}</span>`).join('');
  const more = list.length > 3 ? `<span class="mini-pill">+${list.length - 3}</span>` : '';
  return `<div class="tc-places">${show}${more}</div>`;
}
function tagState(container) { try { return JSON.parse(container.dataset.tags || '[]'); } catch { return []; } }
function setTagState(container, tags) {
  container.dataset.tags = JSON.stringify(tags);
  const input = container.querySelector('input');
  const menu = container.querySelector('.tag-menu');
  container.querySelectorAll('.place-pill').forEach(p => p.remove());
  tags.forEach((t, i) => input.insertAdjacentHTML('beforebegin', placePillHTML(t, i)));
  container.querySelectorAll('[data-remove]').forEach(b => b.onclick = () => {
    const next = tagState(container); next.splice(+b.dataset.remove, 1); setTagState(container, next);
  });
  void menu;
}
let geoTimer = null, geoFallbackWarned = false;
function wireTagInput(container) {
  const input = container.querySelector('input');
  const menu = container.querySelector('.tag-menu');
  setTagState(container, tagState(container)); // wire remove buttons

  const addTag = (t) => {
    const next = tagState(container);
    next.push(t);
    setTagState(container, next);
    input.value = '';
    menu.classList.add('hidden');
    input.focus();
  };

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const val = input.value.trim();
      if (val) addTag({ label: val, kind: 'text', country: null });
    } else if (e.key === 'Backspace' && !input.value) {
      const next = tagState(container); next.pop(); setTagState(container, next);
    }
  });

  input.addEventListener('input', () => {
    const q = input.value.trim();
    clearTimeout(geoTimer);
    if (q.length < 2) { menu.classList.add('hidden'); return; }
    geoTimer = setTimeout(async () => {
      try {
        const r = await fetch('/api/geo-search?q=' + encodeURIComponent(q));
        const j = await r.json();
        if (j.fallback && !geoFallbackWarned) geoFallbackWarned = true;
        if (!j.results || !j.results.length) { menu.classList.add('hidden'); return; }
        menu.innerHTML = j.results.map((res, i) =>
          `<button type="button" data-res="${i}">${res.country ? flagEmoji(res.country) + ' ' : ''}${esc(res.label)}${res.context ? ` <span class="muted">· ${esc(res.context)}</span>` : ''}</button>`
        ).join('');
        menu.classList.remove('hidden');
        menu.querySelectorAll('[data-res]').forEach(b => b.onclick = () => {
          const res = j.results[+b.dataset.res];
          addTag({ label: res.label, kind: res.kind, country: res.country, admin: res.admin, geonameId: res.geonameId, lat: res.lat ?? null, lng: res.lng ?? null });
        });
      } catch { menu.classList.add('hidden'); }
    }, 250);
  });

  input.addEventListener('blur', () => setTimeout(() => menu.classList.add('hidden'), 150));
}

// opts: { title, subtitle, fields, values, onSave(data), onDelete?, attach? {tripId,rowId} }
function openForm(opts) {
  const { title, subtitle, fields, values = {}, onSave, onDelete, attach } = opts;
  const grouped = [];
  for (let i = 0; i < fields.length; i++) {
    if (fields[i].half && fields[i + 1]?.half) { grouped.push([fields[i], fields[i + 1]]); i++; }
    else grouped.push([fields[i]]);
  }
  const body = grouped.map(g =>
    g.length === 2
      ? `<div class="field-2">${fieldHTML(g[0], values[g[0].key])}${fieldHTML(g[1], values[g[1].key])}</div>`
      : fieldHTML(g[0], values[g[0].key])
  ).join('');

  const existingImgs = Array.isArray(values.attachment_paths) ? values.attachment_paths
    : (values.attachment_path ? [values.attachment_path] : []);
  const attachBlock = attach ? `
    <div class="field">
      <label>Tickets / QR codes / documents</label>
      <div class="attach-box" id="attach-trigger">add image(s) — fields auto-fill from the first</div>
      <input type="file" id="attach-input" accept="image/*" multiple class="hidden">
      <div class="attach-gallery" id="attach-gallery"></div>
      <label style="flex-direction:row;gap:6px;align-items:center;margin-top:8px;text-transform:none">
        <input type="checkbox" id="attach-keep" style="width:auto" ${attach.defaultKeep ? 'checked' : ''}>
        keep the image${attach.defaultKeep ? '' : '(s)'} in the app after reading
      </label>
      <div class="parse-note hidden" id="attach-parsenote"></div>
    </div>` : '';

  $('modal').innerHTML = `
    <div class="modal-box">
      <h2>${esc(title)}</h2>
      ${subtitle ? `<div class="mb-sub">${esc(subtitle)}</div>` : ''}
      <form id="modal-form">
        ${attachBlock}
        ${body}
        <div class="modal-msg" id="modal-msg"></div>
        <div class="modal-actions">
          ${onDelete ? '<button type="button" class="btn btn-danger btn-sm" id="modal-delete">delete</button>' : '<span></span>'}
          <div class="right">
            <button type="button" class="btn btn-ghost btn-sm" onclick="closeModal()">cancel</button>
            <button type="submit" class="btn btn-green btn-sm" id="modal-save">save</button>
          </div>
        </div>
      </form>
    </div>`;
  $('modal').classList.remove('hidden');
  $('modal').onclick = (e) => { if (e.target === $('modal')) closeModal(); };
  $('modal').querySelectorAll('.tag-input').forEach(wireTagInput);

  // Conditional fields: show a [data-showif="field:v1|v2"] only when the
  // referenced field currently holds one of those values.
  const applyConditional = () => {
    $('modal').querySelectorAll('[data-showif]').forEach(el => {
      const [ref, vals] = el.dataset.showif.split(':');
      const src = $('modal').querySelector(`[data-key="${ref}"]`);
      const on = src && vals.split('|').includes(src.value);
      el.style.display = on ? '' : 'none';
    });
  };
  $('modal').querySelectorAll('select[data-key]').forEach(s => s.addEventListener('change', applyConditional));
  applyConditional();

  // Airport hints: for flight transport, echo the resolved airport name/city
  // under the From/To fields so a bare IATA code is legible. No network — just
  // the bundled airport table.
  const hintEls = $('modal').querySelectorAll('.airport-hint');
  if (hintEls.length) {
    const typeEl = $('modal').querySelector('[data-key="type"]');
    const updateHints = async () => {
      const isFlight = typeEl && typeEl.value === 'flight';
      if (!isFlight) { hintEls.forEach(h => { h.textContent = ''; }); return; }
      const table = await loadAirports();
      hintEls.forEach(h => {
        const inp = $('modal').querySelector(`[data-key="${h.dataset.hintFor}"]`);
        const code = extractIATA(inp && inp.value);
        const a = code && table[code];
        h.textContent = a
          ? `✈ ${a.name}${a.city ? ' · ' + a.city : ''}${a.country ? ', ' + a.country : ''}`
          : (code ? `no airport found for “${code}”` : '');
      });
    };
    hintEls.forEach(h => {
      const inp = $('modal').querySelector(`[data-key="${h.dataset.hintFor}"]`);
      if (inp) inp.addEventListener('input', updateHints);
    });
    if (typeEl) typeEl.addEventListener('change', updateHints);
    updateHints();
  }

  const readForm = () => {
    const data = {};
    $('modal').querySelectorAll('[data-key]').forEach(el => {
      if (el.classList.contains('tag-input')) {
        const tags = tagState(el);
        data[el.dataset.key] = tags;                 // place_tags jsonb
        data.country_codes = [...new Set(tags.map(t => t.country).filter(Boolean))];
        data.destination = tags.map(t => t.label).join(' · ') || null;
        return;
      }
      let v = el.type === 'checkbox' ? el.checked : el.value;
      if (v === '') v = null;
      if (el.tagName === 'INPUT' && el.type === 'number' && v != null) v = Number(v);
      if (el.tagName === 'INPUT' && el.type === 'datetime-local' && v) v = new Date(v).toISOString();
      data[el.dataset.key] = v;
    });
    return data;
  };

  // Attachment state: keptPaths (already in storage), newFiles (to upload),
  // removedPaths (existing ones the user deleted).
  let keptPaths = existingImgs.slice();
  let newFiles = [];
  let removedPaths = [];

  function renderGallery() {
    if (!attach) return;
    const g = $('attach-gallery');
    const chip = (label, onRemove) =>
      `<span class="attach-chip">${esc(label)}<button type="button" class="x">×</button></span>`;
    g.innerHTML =
      keptPaths.map((p, i) => `<span class="attach-chip" data-kept="${i}">saved image ${i + 1}<button type="button" class="x">×</button></span>`).join('') +
      newFiles.map((f, i) => `<span class="attach-chip" data-new="${i}">${esc(f.name.slice(0, 24))}<button type="button" class="x">×</button></span>`).join('');
    g.querySelectorAll('[data-kept] .x').forEach((b, i) => b.onclick = () => {
      removedPaths.push(keptPaths[i]); keptPaths.splice(i, 1); renderGallery();
    });
    g.querySelectorAll('[data-new] .x').forEach((b, i) => b.onclick = () => {
      newFiles.splice(i, 1); renderGallery();
    });
  }

  const runParse = async () => {
    if (!newFiles.length) return;
    $('attach-parsenote').classList.remove('hidden');
    $('attach-parsenote').innerHTML = 'reading image' + (newFiles.length > 1 ? 's' : '') + '…';
    try {
      const { fields, raw } = await parseTicket(newFiles.slice(0, 4), attach.kind);
      console.log('parse-ticket →', fields);
      const filled = fillFormFromParsed(fields);
      if (filled) {
        $('attach-parsenote').textContent = 'fields filled — check them before saving';
      } else {
        // show what the model saw so the user can copy from it
        $('attach-parsenote').innerHTML =
          `couldn't map fields automatically — enter them manually` +
          (raw ? `<br><span style="color:var(--faint)">read: ${esc(String(raw).slice(0, 200))}</span>` : '');
      }
    } catch (err) {
      $('attach-parsenote').textContent = 'parsing failed (' + (err.message || 'error') + ') — enter fields manually';
    }
  };

  if (attach) {
    renderGallery();
    $('attach-trigger').onclick = () => $('attach-input').click();
    $('attach-input').onchange = async () => {
      const picked = [...$('attach-input').files];
      if (!picked.length) return;
      newFiles.push(...picked);
      $('attach-input').value = '';
      renderGallery();
      // (re)parse using every newly-added image together
      await runParse();
    };
  }

  function fillFormFromParsed(parsed) {
    if (!parsed || typeof parsed !== 'object' || !Object.keys(parsed).length) return false;
    let any = false;
    for (const [k, val] of Object.entries(parsed)) {
      const el = $('modal').querySelector(`[data-key="${k}"]`);
      if (!el || val == null || val === '') continue;

      // The purpose/type select always yields to the parser (its current
      // value is just a default, never user input at this point).
      if (k === 'type' && el.tagName === 'SELECT') {
        const want = normParsedType(String(val).toLowerCase());
        const opt = [...el.options].find(o =>
          o.value.toLowerCase() === want || o.text.toLowerCase().includes(want) ||
          o.value.toLowerCase() === String(val).toLowerCase());
        if (opt) { el.value = opt.value; any = true; el.dispatchEvent(new Event('change')); }
        continue;
      }

      // For every other field: don't clobber something already filled in.
      if (el.value && el.value !== '—') continue;
      if (el.type === 'datetime-local') {
        // Treat the parser's ISO string as the literal wall-clock time printed
        // on the ticket — do NOT round-trip through Date(), which reinterprets
        // a timezone-less string in the browser's own timezone and silently
        // shifts the displayed hour when that differs from the ticket's.
        const s = String(val);
        el.value = s.length > 10 ? s.slice(0, 16) : s.slice(0, 10) + 'T00:00';
      }
      else if (el.type === 'date') el.value = String(val).slice(0, 10);
      else el.value = val;
      any = true;
      el.dispatchEvent(new Event('change'));
    }
    return any;
  }

  $('modal-form').onsubmit = async (e) => {
    e.preventDefault();
    $('modal-save').disabled = true;
    $('modal-msg').textContent = '';
    try {
      const data = readForm();
      const keep = attach ? !!$('attach-keep')?.checked : false;
      if (attach) {
        data.attachment_paths = keep ? keptPaths.slice() : [];
        delete data.attachment_path;                 // legacy single column
      }
      const saved = await onSave(data);
      if (attach) {
        const rowId = saved?.id || attach.rowId;
        let folder = attach.folder;
        if (attach.userFolder) {
          const { data: { user } } = await sb.auth.getUser();
          folder = `user/${user.id}`;
        }
        const uploaded = [];
        if (keep) {
          for (const f of newFiles) {
            const path = `${folder}/${rowId}/${Date.now()}_${Math.random().toString(36).slice(2, 7)}_${f.name.replace(/[^\w.-]/g, '_')}`;
            const up = await sb.storage.from('tickets').upload(path, f, { upsert: true });
            if (!up.error) uploaded.push(path);
          }
        }
        // remove: rows the user deleted, plus — if 'keep' is off — every kept path
        const toRemove = keep ? removedPaths : [...removedPaths, ...keptPaths];
        if (toRemove.length) await sb.storage.from('tickets').remove(toRemove);
        const finalPaths = keep ? [...keptPaths, ...uploaded] : [];
        await sb.from(attach.table).update({ attachment_paths: finalPaths }).eq('id', rowId);
      }
      closeModal();
      if (opts.after) await opts.after();
    } catch (err) {
      $('modal-msg').textContent = err.message || String(err);
      $('modal-save').disabled = false;
    }
  };

  if (onDelete) $('modal-delete').onclick = async () => {
    if (!confirm('Delete this permanently?')) return;
    $('modal-delete').disabled = true;
    try { await onDelete(); closeModal(); if (opts.after) await opts.after(); }
    catch (err) { $('modal-msg').textContent = err.message || String(err); $('modal-delete').disabled = false; }
  };
}

// Downscale an image file to at most `max` px on the long edge and re-encode
// as JPEG — keeps a ticket readable while cutting the upload from MBs to KBs.
// max/quality are kept high enough that small printed times/track numbers on
// a screenshot stay legible to the vision model — over-downscaling here was a
// contributor to misread departure/arrival times.
function shrinkImage(file, max = 2200, quality = 0.9) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = c.toDataURL('image/jpeg', quality);
      resolve({ data: dataUrl.split(',')[1], mime: 'image/jpeg' });
    };
    img.onerror = () => {
      // fall back to the raw file
      const r = new FileReader();
      r.onload = () => resolve({ data: String(r.result).split(',')[1], mime: file.type || 'image/jpeg' });
      r.readAsDataURL(file);
    };
    img.src = URL.createObjectURL(file);
  });
}

// Send one or more images to the parse endpoint. kind = transport|stay|doc.
async function parseTicket(files, kind) {
  const list = Array.isArray(files) ? files : [files];
  const images = await Promise.all(list.slice(0, 4).map(f => shrinkImage(f)));
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 45000);
  let res;
  try {
    res = await fetch('/api/parse-ticket', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ images, kind }),
      signal: ctrl.signal,
    });
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'timed out' : 'network error');
  } finally { clearTimeout(t); }
  const j = await res.json().catch(() => ({}));
  if (!res.ok) {
    const d = j.detail ? (typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail)) : '';
    throw new Error((j.error || 'parse failed') + (d ? ': ' + d.slice(0, 120) : ''));
  }
  return j;   // { fields, model, raw }
}

  if (/teacher training|\bttc\b|\bcourse\b|training|workshop|certification|programme|program|study|semester|class/.test(s)) return 'course';
  if (/retreat|meditation|wellness|ashram|silent/.test(s)) return 'retreat';
  if (/house ?sit|pet ?sit|farm ?sit|\bsit\b|trustedhousesitters|\bths\b/.test(s)) return 'housesit';
  if (/volunteer|work exchange|wwoof|workaway|helpx|internship/.test(s)) return 'work';
  if (/camp|surf|climb|dive|dives|diving|training camp|academy/.test(s)) return 'sport';
  if (/hostel/.test(s)) return 'hostel';
  if (/hotel|resort|inn\b/.test(s)) return 'hotel';
  if (/airbnb|apartment|rental|flat\b/.test(s)) return 'airbnb';
  if (/guest ?house|\bb&b\b|bed and breakfast|homestay|pension/.test(s)) return 'guesthouse';
  if (/friend|family|relative|parents/.test(s)) return 'family';
  return s;
}

function newTrip() {
  openForm({
    title: 'New trip', fields: TRIP_FIELDS, values: { base_currency: currentProfile?.base_currency || 'EUR' },
    onSave: async (d) => {

      if (!d.base_currency) d.base_currency = currencyForCountry((d.country_codes || [])[0]);
      const { data, error } = await sb.from('trips').insert({ ...d, user_id: user.id }).select().single();
      if (error) throw error; return data;
    },
    after: routeToOverview,
  });
}
function editTrip() {
  openForm({
    title: 'Edit trip', fields: TRIP_FIELDS, values: currentTrip,
    onSave: async (d) => {
      const { error } = await sb.from('trips').update(d).eq('id', currentTrip.id);
      if (error) throw error;
    },
    onDelete: async () => {
      // wipe storage objects for this trip, then the row (cascade handles children)
      const paths = [...currentStays, ...currentTransport].flatMap(r => r.attachment_paths || (r.attachment_path ? [r.attachment_path] : []));
      if (paths.length) await sb.storage.from('tickets').remove(paths);
      const { error } = await sb.from('trips').delete().eq('id', currentTrip.id);
      if (error) throw error;
    },
    after: async () => { if (currentTrip && !await tripStillExists()) routeToOverview(); else openTrip(currentTrip.id); },
  });
}
async function tripStillExists() {
  const { data } = await sb.from('trips').select('id').eq('id', currentTrip.id).maybeSingle();
